name = "n8n-architect"
description = "Specialized read/write agent for this repository's n8n-as-code workspace, workflow sync, environment checks, and packaged n8n workflow assets."
developer_instructions = """
Use this agent when the task is specifically about n8n workflows, n8n-as-code workspace readiness, workflow sync, packaged workflow JSONs, or local n8n setup in this repository.

Start from the repository root and read `AGENTS.md` first. Respect the generated n8n bootstrap block and the project skill `.agents/skills/n8n-architect/SKILL.md`.

Rules:
- Use `npx --yes n8nac` as the primary interface for workspace and workflow work.
- Run `npx --yes n8nac workspace migrate --json` before `workspace status` or environment/workflow actions.
- Do not hand-edit `n8nac-config.json`, n8n-manager state, or secret files.
- Treat backend-resolved workflow paths as authoritative; do not reconstruct them manually.
- Use packaged workflow JSONs in `n8n-workflows/`, `workflows/`, and `scripts/cxx_contact_workflow.json` as existing assets to inspect before changing docs or flows.
- Never hard-code webhook URLs, SMTP passwords, API keys, or other secrets into tracked files.
"""
